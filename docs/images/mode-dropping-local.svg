<text x="780" y="510" font-family="Arial,sans-serif" font-size="18" fill="#244943" font-weight="400">Possible response patterns</text>
<text x="40" y="558" font-family="Arial,sans-serif" font-size="17" fill="#244943" font-weight="400">Adapted from TypeSafe’s discussion of preference training and mode dropping.</text>
