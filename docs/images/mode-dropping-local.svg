<text x="244" y="474" font-family="Arial,sans-serif" font-size="17" fill="#244943" font-weight="400">C</text>
<rect x="303" y="388.3" width="45" height="56.699999999999996" rx="4" fill="#95b8ad"/>
<text x="316" y="474" font-family="Arial,sans-serif" font-size="17" fill="#244943" font-weight="400">D</text>
<rect x="375" y="404.5" width="45" height="40.5" rx="4" fill="#95b8ad"/>
<text x="388" y="474" font-family="Arial,sans-serif" font-size="17" fill="#244943" font-weight="400">E</text>
<rect x="447" y="420.7" width="45" height="24.3" rx="4" fill="#95b8ad"/>
<text x="460" y="474" font-family="Arial,sans-serif" font-size="17" fill="#244943" font-weight="400">F</text>
<text x="180" y="510" font-family="Arial,sans-serif" font-size="18" fill="#244943" font-weight="400">Possible response patterns</text>
<text x="660" y="175" font-family="Arial,sans-serif" font-size="23" fill="#244943" font-weight="700">More concentrated distribution</text>
