<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img">
<title>Mode dropping: a conceptual illustration</title>
<rect width="1200" height="600" fill="#f8faf9"/>
<text x="40" y="52" font-family="Arial,sans-serif" font-size="30" fill="#244943" font-weight="700">Mode dropping: a conceptual illustration</text>
<text x="40" y="86" font-family="Arial,sans-serif" font-size="18" fill="#244943" font-weight="400">A broader distribution compared with one concentrated on fewer response patterns.</text>
<text x="40" y="117" font-family="Arial,sans-serif" font-size="17" fill="#244943" font-weight="400">Illustrative values only — not measured model outputs or a benchmark.</text>
<text x="60" y="175" font-family="Arial,sans-serif" font-size="23" fill="#244943" font-weight="700">Broader response distribution</text>
