<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Our company classification pipeline</title><desc id="desc">Current web app: Exa synthesis, two Jev calls, deterministic lookup, and SQLite. The taxonomy is hierarchical; current model inference is flat. Final classification has no separate confidence gate.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#667f88"/></marker></defs>
<rect width="1200" height="560" fill="#f7faf9"/>
<text x="40" y="48" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#163c38">Our company classification pipeline</text>
<text x="40" y="80" font-family="Arial,sans-serif" font-size="17" fill="#48635f">Current web app: Exa synthesis, two Jev calls, deterministic lookup, and SQLite.</text>
<text x="40" y="125" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#48635f">01  RETRIEVE AND CHECK EVIDENCE</text>
<rect x="40" y="140" width="340" height="115" rx="12" fill="#e4efec" stroke="#bfd3cb"/>
<text x="58" y="172" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163c38">Company name → Exa auto</text>
<text x="58" y="198" font-family="Arial,sans-serif" font-size="16" fill="#294c48">Synthesize profile and URL;</text>
<text x="58" y="222" font-family="Arial,sans-serif" font-size="16" fill="#294c48">retain source evidence</text>
<path d="M386 198 H412" stroke="#667f88" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="420" y="140" width="340" height="115" rx="12" fill="#d4e9e2" stroke="#bfd3cb"/>
<text x="438" y="172" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163c38">Jev call 1</text>
<text x="438" y="198" font-family="Arial,sans-serif" font-size="16" fill="#294c48">Identity Choice +</text>
<text x="438" y="222" font-family="Arial,sans-serif" font-size="16" fill="#294c48">evidence-sufficiency Noul</text>
<path d="M766 198 H792" stroke="#667f88" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="800" y="140" width="340" height="115" rx="12" fill="#e7edf3" stroke="#bfd3cb"/>
<text x="818" y="172" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163c38">Python acceptance gate</text>
<text x="818" y="198" font-family="Arial,sans-serif" font-size="16" fill="#294c48">Failed checks → needs_review</text>
<text x="818" y="222" font-family="Arial,sans-serif" font-size="16" fill="#294c48">Accepted profile → next stage</text>
<text x="40" y="315" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#48635f">02  CLASSIFY AND RECORD</text>
<rect x="40" y="330" width="340" height="115" rx="12" fill="#e4efec" stroke="#bfd3cb"/>
<text x="58" y="362" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163c38">Accepted description</text>
<text x="58" y="388" font-family="Arial,sans-serif" font-size="16" fill="#294c48">Whole-company scope;</text>
<text x="58" y="412" font-family="Arial,sans-serif" font-size="16" fill="#294c48">77 leaf paths + 2 abstentions</text>
<path d="M386 388 H412" stroke="#667f88" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="420" y="330" width="340" height="115" rx="12" fill="#d4e9e2" stroke="#bfd3cb"/>
<text x="438" y="362" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163c38">Jev call 2</text>
<text x="438" y="388" font-family="Arial,sans-serif" font-size="16" fill="#294c48">One flat industry Choice</text>
<text x="438" y="412" font-family="Arial,sans-serif" font-size="16" fill="#294c48">returns a distribution</text>
<path d="M766 388 H792" stroke="#667f88" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="800" y="330" width="340" height="115" rx="12" fill="#e7edf3" stroke="#bfd3cb"/>
<text x="818" y="362" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#163c38">Python + SQLite</text>
<text x="818" y="388" font-family="Arial,sans-serif" font-size="16" fill="#294c48">Derive parents and code;</text>
<text x="818" y="412" font-family="Arial,sans-serif" font-size="16" fill="#294c48">save results, cost, and timing</text>
<text x="40" y="535" font-family="Arial,sans-serif" font-size="16" fill="#48635f">The taxonomy is hierarchical; current model inference is flat. Final classification has no separate confidence gate.</text></svg>